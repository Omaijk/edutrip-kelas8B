<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bar Navigasi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background-color: #ffffff;
    }

    .hero {
      height: 300px;
      background-color: #dae2ff;
      background-image: url('download (6).gif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      color: #ffffff;
      font-size: 36px;
      text-shadow: 1px 1px 4px #000000;
      animation: fadeIn 1s ease-in-out;
    }

    header {
      background-color: rgba(237, 237, 255, 0.9);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 20px 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header a {
      color: #4f5bb3;
      text-decoration: none;
      margin: 10px 20px;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 15px;
      border-radius: 10px;
      transition: all 0.3s ease;
      background-color: rgba(212, 215, 247, 0.9);
    }

    header a:hover {
      background-color: rgba(191, 201, 229, 0.9);
      color: #242b62;
      transform: scale(1.05);
    }

    .content-wrapper {
      display: flex;
      max-width: 1000px;
      margin: 60px auto 40px auto;
      padding: 0 20px;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .text {
      flex: 1;
      font-size: 18px;
      line-height: 1.6;
      color: #2f315c;
    }

    .image {
      flex: 1;
      text-align: center;
    }

    .image img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    p {
      font-size: 20px;
      color: rgb(2, 26, 124);
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>This is 'Mandarin'</h1>
  </div>

  <header>
    <a href="index.html">Home</a>
    <a href="agama.html">Agama</a>
    <a href="ips.html">IPS</a>
    <a href="bahasaindonesia.html">Bahasa Indonesia</a>
    <a href="mandarin.html">Mandarin</a>
    <a href="ppkn.html">PPKN</a>
    <a href="english.html">English</a>
  </header>

  <div class="content-wrapper">
    <div class="text">
      <p>在台湾，我结识了一新朋友。她的名字是鄧宜姍。她的生日是五月十九日, 今年她十五岁了。她哪个学校读书是海星高中，她今年是高中一年级。她喜欢吃巧克力和她的爱好是畫畫。</p>
      <p>在台湾，我去了九份街，爬了两百多级台阶。我最喜欢的活动是在酒店睡觉。我看到了很多建筑物，比如博物馆和纪念馆，它们让我了解了台湾的历史。</p>
    </div>
    <div class="image">
      <img src="Screenshot 2025-04-09 123457.png" alt="Hualien Trip">
    </div>
  </div>

</body>
</html>
